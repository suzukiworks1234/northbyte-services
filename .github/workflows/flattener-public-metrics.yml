name: Dataset Flattener public usage snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flattener-public-metrics.yml'
      - 'scripts/snapshot-public-apify-actor.mjs'
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flattener-public-metrics
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check scripts/snapshot-public-apify-actor.mjs
      - name: Read published Actor stats (no chargeable Run)
        run: node scripts/snapshot-public-apify-actor.mjs
      - name: Commit daily public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/apify-flattener/*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "metrics: record public Flattener stats"
            git push
          fi
